<style>
/* Layout: phone-shaped app shell. Top bar + scrolling page + bottom tab bar with a sliding pill. Sheets slide up over a dim backdrop. Six category colours carry the whole library. */
:root{
  --bg:#F3F3F8; --surface:#FFFFFF; --surface2:#EAEAF3; --line:#DBDBE7; --fg:#171826; --muted:#666981;
  --accent:#FF6A3D; --accent-ink:#FFFFFF;
  --c-progress:#1F7FE6; --c-completed:#17A06A; --c-backlog:#8E93A8; --c-paused:#C99A00; --c-abandoned:#D23B3B; --c-wishlist:#D6408D;
  --gold:#E2A400; --glow:#22E58B; --shadow:0 8px 24px rgba(20,20,50,.08);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F17; --surface:#171926; --surface2:#222536; --line:#2B2F44; --fg:#EDEEF6; --muted:#9093AB;
    --c-progress:#4BA3FF; --c-completed:#3CCB8F; --c-backlog:#E3E5EE; --c-paused:#FFD43B; --c-abandoned:#F26A66; --c-wishlist:#F57AB9;
    --gold:#F2B93B; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F17; --surface:#171926; --surface2:#222536; --line:#2B2F44; --fg:#EDEEF6; --muted:#9093AB;
  --c-progress:#4BA3FF; --c-completed:#3CCB8F; --c-backlog:#E3E5EE; --c-paused:#FFD43B; --c-abandoned:#F26A66; --c-wishlist:#F57AB9;
  --gold:#F2B93B; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

.muted{color:var(--muted)} .sm{font-size:12.5px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}

#app.hasbg #appbg{opacity:1}

.score.todo{white-space:nowrap}

.sec{display:flex;flex-direction:column;gap:10px}

@keyframes rxio{0%{opacity:0}6%{opacity:1}82%{opacity:1}100%{opacity:0}}
.rx-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 26px;border-radius:24px;background:rgba(14,15,23,.78);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:800 20px var(--display);text-align:center}

@keyframes rxpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.cf{position:absolute;top:-12px;left:var(--x);width:9px;height:15px;border-radius:2px;animation:cfall var(--d) var(--w) cubic-bezier(.3,.5,.6,1) forwards}
@keyframes cfall{to{transform:translate(var(--dx),108vh) rotate(var(--r))}}

.rx-progress .rx-stage>*{grid-area:1/1}
.sw{transform-origin:50% 60%}

@keyframes swL{0%{transform:translateX(-46vw) rotate(10deg);opacity:0}38%{transform:translateX(-4px) rotate(46deg);opacity:1}46%{transform:translateX(-22px) rotate(38deg)}56%,100%{transform:translateX(-6px) rotate(45deg);opacity:1}}

.rx-progress{animation:rxio var(--t) forwards,rxshake .3s .42s}

@keyframes fin{to{opacity:1}}

.lst{position:absolute;width:230px;padding:16px 16px 10px;border-radius:20px;background:rgba(20,22,36,.9);border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:12px;transform:translateY(-30px)}

.nc{animation:cdrop 1s cubic-bezier(.3,.8,.35,1) forwards}

.shelf{position:absolute;width:250px;height:110px;transform:translateY(-30px)}

@keyframes wob{30%{transform:translateY(2px)}60%{transform:translateY(-1px)}}
.sc{position:absolute;bottom:12px;width:34px;height:70px;border-radius:5px 5px 2px 2px;background:var(--c);box-shadow:inset -5px 0 0 rgba(0,0,0,.2),inset 0 6px 0 rgba(255,255,255,.25)}
.sc:nth-child(1){left:14px}.sc:nth-child(2){left:56px}.sc:nth-child(3){left:98px}

@keyframes cshelf{0%{transform:translate(110px,-150px) rotate(35deg) scale(1.5);opacity:0}15%{opacity:1}72%{transform:translate(0,0) rotate(0) scale(1)}86%{transform:translate(0,-8px)}100%{transform:none}}
.bn{position:absolute;width:260px;height:260px;transform:translateY(20px)}

@keyframes binsh{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}

@keyframes cbin{0%{transform:translate(-210px,40px) rotate(0) scale(1.3)}50%{transform:translate(-34px,-110px) rotate(330deg) scale(1.1)}78%{transform:translate(0,-26px) rotate(520deg) scale(.85)}100%{transform:translate(0,38px) rotate(560deg) scale(.5);opacity:0}}

.wish{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translateY(-34px)}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw.on{background:var(--accent);border-color:transparent}
.sw.on::after{transform:translateX(20px);background:var(--accent-ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);display:grid;place-items:center;color:#fff}
.swatch.on{box-shadow:0 0 0 2.5px var(--fg)}
.prof{display:flex;align-items:center;gap:14px}
.prof .av{--s:62px}
details.fq{border-top:1px solid var(--line);padding:12px 0}
details.fq:first-of-type{border-top:0}
details.fq summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.fq summary::-webkit-details-marker{display:none}
details.fq summary::after{content:"+";font:500 20px var(--mono);color:var(--muted)}
details.fq[open] summary::after{content:"–"}
details.fq p{margin-top:8px;color:var(--muted);font-size:14px}
#toast{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
.t{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);animation:rise .25s both}
#onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto}
#onb[hidden]{display:none}
.onb-in{max-width:520px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:rise .5s both}
.onb-in h1{font:800 30px/1.1 var(--display);letter-spacing:-.025em}
.avpick{display:flex;align-items:center;gap:14px}
.avpick .av{--s:72px}
.glyphs{display:flex;gap:8px;flex-wrap:wrap}
.glyph{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.glyph.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.dc{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.dc.on{box-shadow:0 0 0 2.5px var(--fg)}
.chk{display:flex;align-items:center;gap:12px}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 28%,#2B2456 0%,#14142A 48%,#0B0C14 100%);color:#fff;transition:opacity .55s,transform .55s}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px}
.logo{overflow:visible;filter:drop-shadow(0 10px 34px rgba(25,240,255,.38));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.gl-ln{stroke-dasharray:1;stroke-dashoffset:1;opacity:1;animation:gdraw 1.25s .1s cubic-bezier(.6,.1,.3,1) forwards,gfade .7s 1.45s forwards}
.gl-halo{opacity:0;transform-box:fill-box;transform-origin:center;animation:ghalo 2.6s .9s ease-out forwards}
.gl-b{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;animation:gpop .5s var(--d) cubic-bezier(.2,1.8,.4,1) forwards}
.gl-shine{opacity:0;filter:brightness(2.6) saturate(.45);animation:gshon 1s 2.15s ease-in-out forwards}
@keyframes gdraw{to{stroke-dashoffset:0}}
@keyframes gfade{to{opacity:0}}
@keyframes ghalo{0%{opacity:0;transform:scale(.7)}40%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes gpop{to{transform:scale(1);opacity:1}}
@keyframes gshon{0%,100%{opacity:0}50%{opacity:.9}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes bar{to{transform:scaleX(1)}}
@keyframes pop{to{transform:scale(1)}}
.wm{display:flex;font:800 38px/1 var(--display);letter-spacing:-.03em}
.wm span{display:inline-block;opacity:0;transform:translateY(16px);animation:rise2 .5s forwards;animation-delay:calc(1.3s + var(--i)*.06s)}
@keyframes rise2{to{opacity:1;transform:none}}
.tg{font-size:14px;color:rgba(255,255,255,.66);opacity:0;animation:fadein .6s 1.9s forwards}
.loadbar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.loadbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF8A5C,#FF4F7B);transform:translateX(-100%);animation:ld 2.9s .1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes ld{to{transform:none}}
#tapSound{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;color:rgba(255,255,255,.7);font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
#tapSound[hidden]{display:none}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .lg-badge{stroke-dashoffset:0}.lg-fill,.tg,.wm span{opacity:1;transform:none}.lg-bar,.lg-check{transform:none}
}
